# Nombre y Puerto (¡MUY IMPORTANTE: PUERTO 8081!)
spring.application.name=semillero-service
server.port=8081

# Conexión MySQL (Usamos la misma base de datos relacional)
spring.datasource.url=jdbc:mysql://localhost:3306/semillero_2026?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Actuator (Obligatorio para la nota de Monitorización del PDF)
management.endpoints.web.exposure.include=health,info,metrics